<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Scarecrow Farm</title>
<style>
  :root{ --ink:#241d16; --soot:#6b5a45; --straw:#e0b054; --paper:#f4ecd8; --grass:#a8c473; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;background:#2f4a2a;overflow:hidden;touch-action:none;overscroll-behavior:none}
  canvas{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
  #sat{position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top);pointer-events:none}
  #pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 12px calc(16px + env(safe-area-inset-bottom));pointer-events:none}
  #stick,#btns{pointer-events:auto}
  #stick{width:128px;height:128px;flex:none;border-radius:50%;position:relative;touch-action:none;
    background-color:rgba(36,29,22,.3);background-image:radial-gradient(rgba(36,29,22,.5) 1.2px, transparent 1.4px);
    background-size:7px 7px;border:3px solid rgba(36,29,22,.6)}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);
    background:rgba(224,176,84,.92);border:3px solid var(--paper);box-shadow:0 4px 0 rgba(36,29,22,.65);pointer-events:none}
  #btns{position:relative;width:184px;height:156px;flex:none}
  .b{position:absolute;font-family:"Courier New",Courier,monospace;font-weight:700;touch-action:none;cursor:pointer;line-height:1.1;color:var(--ink)}
  .b:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
  .b.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(36,29,22,.75) !important}
  #use{right:0;top:22px;width:104px;height:104px;border-radius:50%;background:rgba(244,236,216,.95);border:4px solid var(--ink);font-size:19px;box-shadow:0 6px 0 rgba(36,29,22,.75)}
  #use.idle{color:#b9a888}
  #shoo{left:6px;top:0;width:66px;height:66px;border-radius:50%;background:rgba(224,176,84,.95);border:3px solid var(--ink);font-size:14px;box-shadow:0 5px 0 rgba(36,29,22,.75)}
  #item{left:0;bottom:4px;width:80px;height:48px;border-radius:12px;background:rgba(36,29,22,.9);color:var(--paper);border:3px solid var(--soot);font-size:12px;box-shadow:0 4px 0 rgba(20,14,10,.8)}
  #item small{display:block;font-size:10px;color:#b9a888;font-weight:400}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sat"></div>
<div id="pad">
  <div id="stick" aria-label="Move"><div id="knob"></div></div>
  <div id="btns">
    <button class="b" id="shoo" aria-label="Shoo crows">Shoo</button>
    <button class="b" id="item" aria-label="Switch item"><small>Holding</small><span>Turnip 8</span></button>
    <button class="b" id="use" aria-label="Use">Use</button>
  </div>
</div>

}

};
const CROPS = Object.keys(CROPDEF);
const COMMON_S = COMMON.map(r => spr(r, GRN));
for (const k of CROPS) { CROPDEF[k].grownS = spr(CROPDEF[k].grown, GRN); CROPDEF[k].ripeS = spr(CROPDEF[k].ripe, CROPPAL[k]); }
function cropSprite(c) {
  const d = CROPDEF[c.type];
  if (c.stage >= d.days) return d.ripeS;
  if (c.stage >= d.days - 1) return d.grownS;
  return COMMON_S[Math.min(c.stage, 2)];
}

/* ================= font ================= */
const F = {
  A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],

  M:[5,7,7,5,5],N:[6,5,5,5,5],O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],R:[6,5,6,5,5],

  ' ':[0,0,0,0,0],'!':[2,2,2,0,2],':':[0,2,0,2,0],'-':[0,0,7,0,0],'.':[0,0,0,0,2],
  ',':[0,0,0,2,4],"'":[2,2,0,0,0],'/':[1,1,2,4,4],'?':[6,1,2,0,2],'+':[0,2,7,2,0],'$':[3,6,2,3,6],
  '(':[1,2,2,2,1],')':[4,2,2,2,4]
};
const textW = (s, sc = 1) => String(s).length * 4 * sc - sc;
function txt(s, x, y, col = 3, sc = 1, align = 'l') {
  s = String(s).toUpperCase();
  const w = textW(s, sc);
  x = Math.round(x); y = Math.round(y);
  if (align === 'c') x = Math.round(x - w / 2); else if (align === 'r') x = x - w;
  g.fillStyle = P[col];
  for (const ch of s) {
    const gl = F[ch];
    if (gl) for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++)
      if ((gl[r] >> (2 - c)) & 1) g.fillRect(x + c * sc, y + r * sc, sc, sc);
    x += 4 * sc;
  }
}
function txtC(s, x, y, colour, sc = 1, align = 'l') {
  const old = P[3]; P[3] = colour; txt(s, x, y, 3, sc, align); P[3] = old;
}
function txtO(s, x, y, col = 3, sc = 1, align = 'l', oc = 0) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) txt(s, x + dx, y + dy, oc, sc, align);
  txt(s, x, y, col, sc, align);
}
function box(x, y, w, h, fill = 0) {
  x = Math.round(x); y = Math.round(y);
  g.fillStyle = P[0];
  for (let i = 0; i < w + 5; i++) if (i % 2 === 0) g.fillRect(x - 1 + i, y + h + 3, 1, 1);
  for (let i = 0; i < h + 5; i++) if (i % 2 === 0) g.fillRect(x + w + 3, y - 1 + i, 1, 1);
  g.fillStyle = P[3]; g.fillRect(x - 3, y - 3, w + 6, h + 6);
  g.fillStyle = P[0]; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = P[fill]; g.fillRect(x, y, w, h);
  g.fillStyle = P[1];
  g.fillRect(x - 1, y - 1, w + 2, 1); g.fillRect(x - 1, y + h, w + 2, 1);
  g.fillRect(x - 1, y - 1, 1, h + 2); g.fillRect(x + w, y - 1, 1, h + 2);
  g.fillStyle = P[3];
  for (const [cx, cy] of [[x - 1, y - 1], [x + w - 1, y - 1], [x - 1, y + h - 1], [x + w - 1, y + h - 1]]) g.fillRect(cx, cy, 2, 2);
}
function rule(x, y, w, col = 1) {
  g.fillStyle = P[col]; g.fillRect(x + 2, y, w - 4, 1);
  g.fillRect(x, y, 1, 1); g.fillRect(x + w - 1, y, 1, 1);
}
function wrap(s, max) {
  const words = s.split(' '), out = []; let line = '';
  for (const w of words) { if ((line + ' ' + w).trim().length > max) { if (line) out.push(line); line = w; } else line = (line + ' ' + w).trim(); }
  if (line) out.push(line);
  return out;
}

/* ================= map ================= */
const STATIC = {};
const put = (x0, y0, w, h, type) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) STATIC[x + ',' + y] = type; };
put(2, 1, 3, 2, 'shack');
put(5, 2, 1, 1, 'bin');
put(1, 4, 1, 1, 'crate');
put(3, 5, 1, 1, 'board');
put(6, 4, 1, 1, 'box');

const TREES = [[1, 19], [4, 19], [2, 22], [5, 23], [1, 26], [4, 27], [2, 30], [5, 31], [1, 33], [6, 33]];
for (const [x, y] of TREES) put(x, y, 1, 1, 'tree');
const isBorder = (x, y) => x <= 0 || y <= 0 || x >= WC - 1 || y >= WR - 1;
const tillable = (x, y) => x >= 9 && x <= WC - 2 && y >= 1 && y <= WR - 2;
const pxTile = (px, py) => [Math.floor(px / TS), Math.floor(py / TS)];

function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const bg = document.createElement('canvas'); bg.width = WW; bg.height = WH;
const POND = { x: TS, y: 14 * TS, w: 48, h: 48 };
function buildBg(season) {
  const SGR = season ? season.gr : GR, STR = season ? season.tr : TR, SFL = season ? season.fl : '#f2a4c0';
  const snow = season === SEASONPAL[3];
  const b = bg.getContext('2d'), r = rng(21);
  let C = SGR;
  const use = q => { C = q; };
  const R = (c, x, y, w, h) => { b.fillStyle = C[c]; b.fillRect(x, y, w, h); };
  const dot = (c, x, y) => { b.fillStyle = C[c]; b.fillRect(x, y, 1, 1); };
  const free = (x, y) => { const [tx, ty] = pxTile(x, y); return !tillable(tx, ty) && !STATIC[tx + ',' + ty] && !STATIC[tx + ',' + (ty + 1)]; };
  R(3, 0, 0, WW, WH);

  // soft meadow patches
  for (let i = 0; i < 46; i++) {
    const cx = r() * WW, cy = r() * WH, rad = 10 + r() * 16;
    for (let y = -rad; y <= rad; y++) for (let x = -rad; x <= rad; x++) {
      const d = (x * x + y * y) / (rad * rad);

  animals.push({ kind, x: sx, y: sy, tx: sx, ty: sy, hx: x, hy: y, stage: 0, growT: 0,

function updateAnimals(dt) {
  for (const a of animals) {
    a.anim += dt;
    const d = Math.hypot(a.tx - a.x, a.ty - a.y);
    if (d < 2) {
      a.wait -= dt;
      if (a.wait <= 0) {
        const hx = a.hx * TS + 8, hy = a.hy * TS + 13;
        a.tx = hx + (Math.random() * 26 - 13);
        a.ty = hy + (Math.random() * 18 - 9);
        a.wait = 1.5 + Math.random() * 2.5;

    } else {
      const dx = a.tx - a.x, dy = a.ty - a.y, sp = 13;
      const step = Math.min(d, sp * dt);

function runAnimals() {

// Row machines: place one at the left of a row and it works the whole line

function rowArea(x, y, rows, fn) {
  const half = (rows - 1) / 2;
  for (let dy = -half; dy <= half; dy++) {
    const ry = y + dy;
    if (ry < 0 || ry >= WR) continue;
    for (let rx = x; rx <= WC - 2; rx++) { const c = farm[ry][rx]; if (c) fn(c, rx, ry); }
  }
}
function runMachines() {

  eachMach('picker', (m, x, y) => rowArea(x, y, 1, c => {
    if (c.crop && c.crop.stage >= CROPDEF[c.crop.type].days) {
      const d = CROPDEF[c.crop.type];
      inv.basket[c.crop.type]++; picked++;
      if (d.regrow) c.crop.stage = d.days - d.regrow; else c.crop = null;
    }
  }));
  eachMach('drill', (m, x, y) => rowArea(x, y, 1, c => {
    if (c.soil && !c.crop && !c.obj && m.seed && inv[m.seed] > 0) { c.crop = { type: m.seed, stage: 0 }; inv[m.seed]--; sown++; }
    else if (c.soil && !c.crop && !c.obj && m.seed && !inv[m.seed]) dry = true;
  }));
  const wet = c => { if (c.soil && !c.wet) { c.wet = true; watered++; } };
  eachMach('sprinkler', (m, x, y) => rowArea(x, y, 1, wet));
  eachMach('tower', (m, x, y) => rowArea(x, y, 3, wet));
  if (picked) L.push('picked ' + picked);
  if (sown) L.push('sowed ' + sown);
  if (watered) L.push('watered ' + watered);

  eachMach('cart', () => { hasCart = true; });
  if (hasCart) {
    let money = 0, gave = 0, filled = [];

    }
    const done = orders.filter(o => Object.values(o.items).every(v => v.got >= v.need));
    for (const o of done) { money += o.reward; rep = Math.min(5, rep + 1); filled.push(o.client); }
    orders = orders.filter(o => !done.includes(o));
    for (const k of GOODSK) {

    coins += money;

const pickR = a => a[Math.random() * a.length | 0];
function makeOffer() {
  const cpool = CLIENTS.filter(c => c.rep <= rep);
  const used = offers.map(o => o.client).concat(orders.map(o => o.client));
  const fresh = cpool.filter(c => !used.includes(c.n));
  const client = pickR(fresh.length ? fresh : cpool);
  let avail = CROPS.filter(k => CROPDEF[k].rep <= rep);
  if (built.shed && rep >= 2) avail = avail.concat(PRODK.filter(k => CROPDEF[PROD[k].from].rep <= rep));
  for (const k of ANIMALK) if (animals.some(a => a.kind === k && a.stage === 1)) avail = avail.concat([ANIMALS[k].product]);
  let kinds = 1 + (rep >= 1 && Math.random() < .5 ? 1 : 0) + (rep >= 3 && Math.random() < .4 ? 1 : 0);
  kinds = Math.min(kinds, avail.length);
  const pool = avail.slice(), items = {};
  const base = { turnip: [3, 7], cabbage: [2, 5], corn: [2, 4], pumpkin: [1, 3], berry: [4, 8],
    soup: [1, 2], pickles: [1, 2], meal: [1, 2], pie: [1, 2], jam: [1, 2],
    egg: [4, 9], wool: [1, 3], milk: [3, 7], truffle: [1, 2] };
  let value = 0, maxDays = 0;
  for (let i = 0; i < kinds; i++) {
    const k = pool.splice(Math.random() * pool.length | 0, 1)[0];
    const [a, b] = base[k];
    const q = Math.round((a + Math.random() * (b - a)) * (1 + rep * .2));
    items[k] = { need: q, got: 0 };
    value += q * GOODS[k].sell;
    const d0 = CROPDEF[k] || (PROD[k] && CROPDEF[PROD[k].from]) || { days: 2 };
    maxDays = Math.max(maxDays, d0.days + (PROD[k] ? 2 : 0));
  }
  const bonus = client.rep >= 3 ? 1.9 : client.rep >= 2 ? 1.75 : 1.6;
  const reward = Math.round(value * bonus / 5) * 5 + 10 * rep;
  const due = day + maxDays + 2 + (Math.random() * 3 | 0);
  return { client: client.n, items, due, reward, posted: day };
}
const reserved = k => orders.reduce((a, o) => a + (o.items[k] ? o.items[k].need - o.items[k].got : 0), 0);

function deliver() {
  if (!orders.length) { say('No orders yet. Check the notice board'); sfx.nope(); return; }
  let given = 0;
  for (const o of orders) for (const k in o.items) {
    const it = o.items[k], n = Math.min(inv.basket[k], it.need - it.got);
    if (n > 0) { inv.basket[k] -= n; it.got += n; given += n; }
  }
  if (!given) { say('Nothing in your basket for these orders'); sfx.nope(); return; }
  flags.delivered = true;
  const done = orders.filter(o => Object.values(o.items).every(v => v.got >= v.need));
  if (done.length) {
    for (const o of done) {
      coins += o.reward; dayStats.earned += o.reward;
      texts.push({ s: '+$' + o.reward, x: 6 * TS + 8, y: 4 * TS - 4, life: 1.6 });
      setRep(rep + 1, o.client + ' loved it!');
    }
    orders = orders.filter(o => !done.includes(o));
    sfx.order();
  } else { say('Delivered ' + given + '. Keep going!'); sfx.sell(); }
}
function setRep(n, why) {
  const before = rep; rep = Math.max(0, Math.min(5, n));
  const newly = SHOP.filter(i => i.rep && i.rep > before && i.rep <= rep).map(i => i.name.toLowerCase());
  if (newly.length) say(why + ' New at the crate: ' + newly.join(', '), 4);
  else say(why + (rep > before ? ' Reputation up!' : ''), 3);
}

const SAVE_KEY = 'scarecrow-farm-v2';
function storageOK() {

  catch (e) { return false; }
}
function save() {

    if (!storageOK()) return;
    const data = { day, coins, canMax, inv, sel, flags, rep, offers, orders, owned, built, shed, weather, weatherNext, music, animals,
      farm: farm.map(row => row.map(c => [c.soil ? 1 : 0, c.wet ? 1 : 0, c.obj || 0, c.hp, c.crop ? c.crop.type : 0, c.crop ? c.crop.stage : 0, c.seed || 0, c.fed ? 1 : 0])) };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));

  } catch (e) {}
}
function checkSave() {
  try { hasSave = storageOK() && !!localStorage.getItem(SAVE_KEY); } catch (e) { hasSave = false; }
}

  } else { g.fillStyle = P[1]; g.fillRect(0, y + HUD_H - 1, VW, 1); }
  if (orders.length) {
    const th = trackerH();
    g.fillStyle = P[1]; g.fillRect(0, y + HUD_H, VW, th);
    g.fillStyle = P[0];
    for (let i = 0; i < VW; i += 2) g.fillRect(i, y + HUD_H + th - 1, 1, 1);
    orders.forEach((o, i) => {
      const left = o.due - day;
      const bits = Object.entries(o.items).map(([k, v]) => v.got + '/' + v.need + ' ' + GOODS[k].short);
      const name = o.client.split(' ')[0].replace("'s", '');
      txt(name + ' ' + bits.join(' '), 3, y + HUD_H + 2 + i * 8, 3);
      txt(left <= 0 ? 'today' : left + 'd', VW - 3, y + HUD_H + 2 + i * 8, left <= 1 ? 3 : 2, 1, 'r');
    });
  }
}
function hintText() {
  if (!flags.tilled) return 'Hop to the field and tap Till';
  if (!flags.planted) return 'Tap Plant to sow a seed';
  if (!flags.watered) return 'Now tap Water';
  if (!flags.board) return 'Restaurants post orders on the notice board';
  if (flags.crowSeen && !flags.shooed) return 'Crows avoid you. Tap Shoo!';
  if (flags.harvested && !flags.sold && !flags.delivered) return 'Sell at the bin or deliver orders at the box';
  if (day === 1 && clockMin() > 1020) return 'Sleep in your shack to end the day';
  if (built.shed && !flags.cooked) return 'Cook crops at the shed for far more money';
  if (seasonOf(day) === 3 && !built.green) return 'Nothing grows in winter. Build, or buy a greenhouse';
  if (rep >= 1 && !flags.mach && !SHOP.some(i => i.mach && inv[i.k] > 0)) return 'The crate now sells machines that work for you';
  if (rep >= 1 && !flags.animalBuildingPlaced && ANIMALK.some(k => inv[ANIMALS[k].building] > 0)) return 'Place your new animal building, then buy an animal for it';
  if (ANIMALK.some(k => buildingsOf(k).length) && !animals.length) return 'Buy an animal from the crate for your building';
  if (animals.length && !flags.fed) return 'Hold feed and tap your animal building so they produce';
  return null;
}
function panel(w, h) {
  const pt = playTop(), pb = playBot();
  const x = Math.round((VW - w) / 2), y = Math.round(Math.max(pt + 4, (pt + pb - h) / 2));
  box(x, y, w, h);
  return [x, y];
}
function drawCard() {
  const w = Math.min(VW - 12, 220), maxc = Math.floor((w - 8) / 4);
  const lines = cardLines.flatMap(s => wrap(s, maxc));
  const h = 24 + lines.length * 9 + 14;
  const [x, y] = panel(w, h);
  txtC(cardTitle, x + w / 2, y + 6, ACC, 1, 'c');
  g.fillStyle = P[1]; g.fillRect(x + 10, y + 15, w - 20, 1);
  lines.forEach((s, i) => txt(s, x + w / 2, y + 21 + i * 9, 2, 1, 'c'));
  if (cardT > .7 && Math.floor(clock * 2) % 2 === 0) txt('Tap next', x + w / 2, y + h - 9, 3, 1, 'c');
}
let menuRows = [];
function drawShop() {
  const w = Math.min(VW - 12, 214), rowH = 10;
  const avail = playBot() - playTop() - 12;
  const vis = Math.max(4, Math.min(SHOP.length, Math.floor((avail - 58) / rowH)));
  const h = 22 + vis * rowH + 36;
  if (menuIdx < shopTop) shopTop = menuIdx;
  if (menuIdx >= shopTop + vis) shopTop = menuIdx - vis + 1;
  shopTop = Math.max(0, Math.min(SHOP.length - vis, shopTop));
  const [x, y] = panel(w, h);
  txtC('Seed crate', x + 6, y + 5, ACC);
  icon('coin', x + w - 14 - textW(String(coins)), y + 5); txt(coins, x + w - 6, y + 5, 3, 1, 'r');
  menuRows = [];
  for (let i = shopTop; i < shopTop + vis; i++) {
    const it = SHOP[i], on = i === menuIdx, ry = y + 18 + (i - shopTop) * rowH;
    menuRows.push([x, ry - 2, w, rowH, i]);
    const locked = it.rep && rep < it.rep, ownedIt = it.upg && owned[it.k];
    if (on) { g.fillStyle = ACC; g.fillRect(x + 2, ry - 2, w - 4, rowH - 1); }
    txt(it.name, x + 6, ry, on ? 0 : locked ? 1 : 3);
    const right = ownedIt ? 'owned' : locked ? it.rep + (it.rep === 1 ? ' star' : ' stars') : '$' + it.price;
    txt(right, x + w - 6, ry, on ? 0 : (locked || coins < it.price) ? 1 : 3, 1, 'r');
  }
  if (shopTop > 0) txt('-', x + w - 4, y + 15, 2, 1, 'r');
  if (shopTop + vis < SHOP.length) txt('-', x + w - 4, y + 18 + vis * rowH - 4, 2, 1, 'r');
  const it = SHOP[menuIdx], by = y + 20 + vis * rowH;
  g.fillStyle = P[1]; g.fillRect(x + 6, by, w - 12, 1);
  wrap(menuMsg || it.info, Math.floor((w - 12) / 4)).slice(0, 2).forEach((l, i) => txt(l, x + w / 2, by + 4 + i * 8, menuMsg ? 3 : 2, 1, 'c'));
  const have = it.animal ? 'You have ' + animals.filter(a => a.kind === it.animalKind).length + ' ' + ANIMALS[it.animalKind].animalPlural + '   '
    : ITEMS.includes(it.k) ? 'You have ' + inv[it.k] + '   ' : '';
  txt(have + 'Shoo: close', x + w / 2, y + h - 9, 2, 1, 'c');
}
function drawShed() {
  const w = Math.min(VW - 12, 214), rowH = 10, h = 22 + PRODK.length * rowH + 34;
  const [x, y] = panel(w, h);
  txtC('Processing shed', x + 6, y + 5, ACC);
  txt(shed.length + '/' + shedCap(), x + w - 6, y + 5, 2, 1, 'r');
  menuRows = [];
  PRODK.forEach((k, i) => {
    const d = PROD[k], on = i === menuIdx, ry = y + 18 + i * rowH, have = inv.basket[d.from] >= d.n;
    menuRows.push([x, ry - 2, w, rowH, i]);
    if (on) { g.fillStyle = ACC; g.fillRect(x + 2, ry - 2, w - 4, rowH - 1); }
    txt(d.name, x + 6, ry, on ? 0 : have ? 3 : 1);
    txt(d.n + ' ' + GOODS[d.from].short + '   $' + d.sell, x + w - 6, ry, on ? 0 : have ? 3 : 1, 1, 'r');
  });
  const d = PROD[PRODK[menuIdx]], by = y + 20 + PRODK.length * rowH;
  g.fillStyle = P[1]; g.fillRect(x + 6, by, w - 12, 1);
  const line = menuMsg || ('You have ' + inv.basket[d.from] + ' ' + GOODS[d.from].short +
    '. Worth $' + d.n * GOODS[d.from].sell + ' raw');
  wrap(line, Math.floor((w - 12) / 4)).slice(0, 2).forEach((l, i) => txt(l, x + w / 2, by + 4 + i * 8, menuMsg ? 3 : 2, 1, 'c'));
  txt('Ready at dawn   Shoo: close', x + w / 2, y + h - 9, 2, 1, 'c');
}
function drawBoard() {
  const w = Math.min(VW - 12, 220), rowH = 28, n = Math.max(1, offers.length), h = 22 + n * rowH + 26;
  const [x, y] = panel(w, h);
  txtC('Notice board', x + 6, y + 5, ACC);
  txt('Orders ' + orders.length + '/' + maxOrders(), x + w - 6, y + 5, 2, 1, 'r');
  menuRows = [];
  if (!offers.length) txt('No new orders today', x + w / 2, y + 24, 2, 1, 'c');
  offers.forEach((o, i) => {
    const ry = y + 18 + i * rowH, on = i === menuIdx;
    menuRows.push([x, ry - 2, w, rowH, i]);
    if (on) { g.fillStyle = ACC; g.fillRect(x + 2, ry - 2, w - 4, rowH - 2); }
    const c1 = on ? 0 : 3, c2 = on ? 1 : 2;
    txt(o.client, x + 6, ry, c1);
    txt('$' + o.reward, x + w - 6, ry, c1, 1, 'r');
    txt(orderLine(o), x + 6, ry + 8, c2);
    txt('Due in ' + (o.due - day) + ' days', x + 6, ry + 16, c2);
  });
  const by = y + 20 + n * rowH;
  g.fillStyle = P[1]; g.fillRect(x + 6, by - 2, w - 12, 1);
  txt(menuMsg || 'Pays better than the bin', x + w / 2, by + 3, menuMsg ? 3 : 2, 1, 'c');
  txt('Use: take   Shoo: close', x + w / 2, y + h - 9, 2, 1, 'c');
}
function drawTitle() {
  g.drawImage(D12, 0, 0);
  const w = Math.min(VW - 24, 176), h = 84;
  const pt = hudTop(), pb = playBot();
  const x = Math.round((VW - w) / 2), y = Math.round(pt + (pb - pt) * .26);
  box(x, y, w, h);
  const cxm = x + w / 2;
  // a crow on the frame
  const hop = (clock % 3) < .25 ? -1 : 0;
  g.drawImage(S.crow[1], Math.round(x + w - 22), Math.round(y - 9 + hop));
  // wheat sprigs either side of the title
  const sprig = (sx, dir) => {
    g.fillStyle = ACC;
    for (let i = 0; i < 7; i++) g.fillRect(sx, y + 12 + i, 1, 1);
    for (let i = 0; i < 3; i++) { g.fillRect(sx + dir, y + 13 + i * 2, 1, 1); g.fillRect(sx - dir, y + 14 + i * 2, 1, 1); }
  };
  sprig(x + 12, 1); sprig(x + w - 13, -1);
  txtC('Scarecrow', cxm, y + 10, ACC, 2, 'c');
  txtC('Farm', cxm, y + 24, ACC, 2, 'c');
  rule(x + 14, y + 38, w - 28, 1);
  const blink = Math.floor(clock * 2) % 2 === 0;
  if (hasSave) {
    txt('Use: continue', cxm, y + 46, blink ? 3 : 2, 1, 'c');
    txt('Shoo: new farm', cxm, y + 57, 2, 1, 'c');
  } else {
    txt('Tap start', cxm, y + 48, blink ? 3 : 2, 1, 'c');
    txt('to open the farm', cxm, y + 59, 2, 1, 'c');
  }
  rule(x + 14, y + 70, w - 28, 1);
  txt('Grow  sell  shoo', cxm, y + 75, 1, 1, 'c');
}
function render() {
  g.imageSmoothingEnabled = false;
  drawWorld();
  if (state === 'title') { drawTitle(); return; }
  const cm2 = clockMin(), e2 = endMin();
  let dark = cm2 > e2 - 45 ? 2 : cm2 > e2 - 165 ? 1 : 0;
  if (weather === 'rain' || weather === 'frost') dark = Math.max(dark, 1);
  if (dark === 1) g.drawImage(D12, 0, 0);
  else if (dark === 2) g.drawImage(D25, 0, 0);
  if (state === 'night') { g.drawImage(D50, 0, 0); drawHUD(); drawCard(); return; }
  if (state === 'shop') { g.drawImage(D50, 0, 0); drawHUD(); drawShop(); return; }
  if (state === 'board') { g.drawImage(D50, 0, 0); drawHUD(); drawBoard(); return; }
  if (state === 'shed') { g.drawImage(D50, 0, 0); drawHUD(); drawShed(); return; }
  drawHUD();
  const s = msg ? msg.s : hintText();
  if (s) {
    const lines = wrap(s, Math.floor((VW - 20) / 4));
    const w = Math.max(...lines.map(l => textW(l))) + 10, h = lines.length * 8 + 5;
    const y = playTop() + 4;
    box(VW / 2 - w / 2, y, w, h);
    lines.forEach((l, i) => txt(l, VW / 2, y + 3 + i * 8, msg ? 3 : 2, 1, 'c'));
  }
}

/* ================= input ================= */
const useBtn = document.getElementById('use'), shooBtn = document.getElementById('shoo'), itemBtn = document.getElementById('item');
let lastUse = '';
function updateUseBtn() {
  let label = 'Use', idle = false;
  if (state === 'day') { const a = getAction(); label = a ? a.label : 'Use'; idle = !a; }
  else if (state === 'shop') label = 'Buy';
  else if (state === 'board') label = 'Take';
  else if (state === 'shed') label = 'Cook';
  else if (state === 'night') label = 'Next';
  else if (state === 'title') label = hasSave ? 'Go on' : 'Start';
  const key = label + idle;
  if (key !== lastUse) { useBtn.textContent = label; useBtn.classList.toggle('idle', idle); lastUse = key; }
}
function updateItemBtn() {
  if (!inv) return;
  const n = inv[sel] || 0;
  const name = itemName(sel);
  itemBtn.querySelector('span').textContent = n > 0 ? name + ' ' + n : 'Nothing';
}
function primary() {
  au();
  if (state === 'title') { if (hasSave) loadGame(); else newGame(); }
  else if (state === 'night') continueCard();
  else if (state === 'shop') buy();
  else if (state === 'board') takeOrder();
  else if (state === 'shed') cook();
  else if (state === 'day') {
    if (player.act > 0) return;
    const a = getAction();
    if (a) { player.act = .15; a.fn(); }
  }
}
function secondary() {
  au();
  if (state === 'title') newGame();
  else if (state === 'shop' || state === 'board' || state === 'shed') { state = 'day'; sfx.tick(); }
  else if (state === 'day') shoo();
  else if (state === 'night') continueCard();
}
function third() { au(); if (state === 'day' || state === 'shop') cycleItem(); }
function toggleMusic() { music = !music; au(); say(music ? 'Music on' : 'Music off', 1.6); if (music) { musT = 0; musicTick(0); } }

addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  if (e.repeat) return;
  if (k === ' ' || k === 'enter' || k === 'j') { primary(); if (state === 'day') holdUse = true; }
  if (k === 'm') toggleMusic();
  if (k === 'k' || k === 'shift' || k === 'escape') secondary();
  if (k === 'q' || k === 'e' || k === 'tab') { e.preventDefault(); third(); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase(); keys[k] = false;
  if (k === ' ' || k === 'enter' || k === 'j') holdUse = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; holdUse = false; });

const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let sid = null;
function mv(e) {
  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = r.width / 2 * .55, d = Math.hypot(dx, dy);
  if (d > m) { dx *= m / d; dy *= m / d; }
  jx = dx / m; jy = dy / m;
  if (Math.hypot(jx, jy) < .18) { jx = 0; jy = 0; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
stick.addEventListener('pointerdown', e => { sid = e.pointerId; stick.setPointerCapture(sid); au(); mv(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === sid) mv(e); });
const release = e => { if (e.pointerId === sid) { sid = null; jx = jy = 0; knob.style.transform = 'translate(-50%,-50%)'; } };
stick.addEventListener('pointerup', release);
stick.addEventListener('pointercancel', release);

function wireBtn(b, fn, hold) {
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); fn(); if (hold && state === 'day') holdUse = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => { b.classList.remove('on'); if (hold) holdUse = false; }));
  b.addEventListener('click', e => { if (e.detail === 0) fn(); });
}
wireBtn(useBtn, primary, true);
wireBtn(shooBtn, secondary);
wireBtn(itemBtn, third);
cv.addEventListener('pointerdown', e => {
  au();
  const x = e.clientX / scale, y = e.clientY / scale;
  if (state === 'shop' || state === 'board' || state === 'shed') {
    const hit = menuRows.find(([rx, ry, rw, rh]) => x >= rx && x < rx + rw && y >= ry && y < ry + rh);
    if (hit) { if (hit[4] === menuIdx) primary(); else { menuIdx = hit[4]; menuMsg = null; sfx.tick(); } }
  } else if (y < hudTop() + HUD_H + 2 && x > VW - 46 && x < VW - 33 && state !== 'title') toggleMusic();
  else if (state === 'title' || state === 'night') primary();
});
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ================= resize & loop ================= */
const pad = document.getElementById('pad'), sat = document.getElementById('sat');
function resize() {
  const w = innerWidth, h = innerHeight;
  scale = Math.max(2, Math.round(Math.min(w, h) / 200));
  VW = Math.ceil(w / scale); VH = Math.ceil(h / scale);
  cv.width = VW; cv.height = VH;
  cv.style.width = VW * scale + 'px'; cv.style.height = VH * scale + 'px';
  g.imageSmoothingEnabled = false;
  D50 = makeDither(3); D25 = makeDither(2); D12 = makeDither(1);
  const pr = pad.getBoundingClientRect();
  ctrlH = Math.max(0, Math.ceil((h - pr.top) / scale) - 8);
  satTop = Math.ceil(sat.getBoundingClientRect().height / scale);
  if (state === 'day') snapCam();
}
addEventListener('resize', resize);
resize();
blankFarm();
refreshBg();
buildShop();
checkSave();
// Safety net: also save whenever the tab is hidden or closed, so mid-day
// progress (tilling, planting, coins) isn't lost between day-boundary saves.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && state !== 'title') save(); });
addEventListener('pagehide', () => { if (state !== 'title') save(); });
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(); updateUseBtn();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

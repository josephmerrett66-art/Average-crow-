<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scarecrow Farm</title>
<style>
  :root{ --ink:#141413; --soot:#4d4b46; --straw:#a3a09a; --paper:#efede6; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;background:var(--ink);overflow:hidden;touch-action:none;overscroll-behavior:none}
  canvas{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
  #sat{position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top);pointer-events:none}
  #pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 12px calc(16px + env(safe-area-inset-bottom));pointer-events:none}
  #stick,#btns{pointer-events:auto}
  #stick{width:128px;height:128px;flex:none;border-radius:50%;position:relative;touch-action:none;
    background-color:rgba(20,20,19,.28);background-image:radial-gradient(rgba(20,20,19,.45) 1.2px, transparent 1.4px);
    background-size:7px 7px;border:3px solid rgba(20,20,19,.55)}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);
    background:rgba(163,160,154,.9);border:3px solid var(--paper);box-shadow:0 4px 0 rgba(20,20,19,.6);pointer-events:none}
  #btns{position:relative;width:184px;height:156px;flex:none}
  .b{position:absolute;font-family:"Courier New",Courier,monospace;font-weight:700;touch-action:none;cursor:pointer;line-height:1.1;color:var(--ink)}
  .b:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
  .b.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(20,20,19,.7) !important}
  #use{right:0;top:22px;width:104px;height:104px;border-radius:50%;background:rgba(239,237,230,.93);border:4px solid var(--ink);font-size:19px;box-shadow:0 6px 0 rgba(20,20,19,.7)}
  #use.idle{color:var(--straw)}
  #shoo{left:6px;top:0;width:66px;height:66px;border-radius:50%;background:rgba(163,160,154,.92);border:3px solid var(--ink);font-size:14px;box-shadow:0 5px 0 rgba(20,20,19,.7)}
  #item{left:0;bottom:4px;width:80px;height:48px;border-radius:12px;background:rgba(20,20,19,.86);color:var(--paper);border:3px solid var(--soot);font-size:12px;box-shadow:0 4px 0 #000}
  #item small{display:block;font-size:10px;color:var(--straw);font-weight:400}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sat"></div>
<div id="pad">
  <div id="stick" aria-label="Move"><div id="knob"></div></div>
  <div id="btns">
    <button class="b" id="shoo" aria-label="Shoo crows">Shoo</button>
    <button class="b" id="item" aria-label="Switch item"><small>Holding</small><span>Turnip 8</span></button>
    <button class="b" id="use" aria-label="Use">Use</button>
  </div>
</div>

<script>
(() => {
const TS = 16, WC = 28, WR = 36, WW = WC * TS, WH = WR * TS;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const P = ['#141413', '#4d4b46', '#a3a09a', '#efede6'];
let VW = 195, VH = 420, scale = 2, ctrlH = 100, satTop = 0;

/* ================= sprites ================= */
function spr(rows, map) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < rows[j].length; i++) {
    let ch = rows[j][i];
    if (ch === '.') continue;
    if (map && map[ch] !== undefined) ch = map[ch];
    x.fillStyle = P[+ch]; x.fillRect(i, j, 1, 1);
  }
  return c;
}
function flip(c) {
  const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
  const x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
  return f;
}
const pair = rows => { const r = spr(rows); return [flip(r), r]; };

const SC = spr([
  "....0000....","...022220...","...022220...",".0000000000.",
  "..03333330..","..03033030..","..03333330..","..03011030..","...033330...",
  "220111111022","2.01111110.2","...011110...","...012210...","...011110...",
  "....2002....",".....00.....",".....00....."
]);
const SC_BACK = spr([
  "....0000....","...022220...","...022220...",".0000000000.",
  "..03333330..","..03333330..","..03333330..","..03333330..","...033330...",
  "220111111022","2.01111110.2","...011110...","...011110...","...011110...",
  "....2002....",".....00.....",".....00....."
]);
const SC_F = spr([
  "....0000....","...022220...","...022220...",".0000000000.",
  "2.03333330.2","220303303022",".1033333301.",".1030110301.","..10333301..",
  "...011110...","...011110...","...011110...","...012210...","...011110...",
  "....2002....",".....00.....",".....00....."
]);
const S = {
  crow: pair(["......000.",".....00300","0...000022","00000000..",".0000000..","..00000...","...0..0..."]),
  f1: pair(["0........0","00......00",".00.00.00.","..000030..","...00002..","....00...."]),
  f2: pair(["..........","...0000...","..000030..",".00000002.","00......00","0........0"]),
  chime: spr(["...0000...","0000000000","00.0220.00","33.0220.33","33.0220.33","00.0220.00",
    "...0220...","...0220...","...0220...","...0220...","...0220...","..000000.."]),
  sprinkler: spr(["...00...","..0330..","...00...",".000000.","02222220","02111120",".000000."]),
  drill: spr([
    "..00000000..",
    ".0222222220.",
    "023333333320",
    "023300003320",
    "023333333320",
    "022222222220",
    ".0022222200.",
    "...022220...",
    "...002200...",
    "000000000000",
    "033000000330",
    "030300003030",
    "033000000330",
    "000000000000"]),
  picker: spr([
    "...0000000..",
    "..02222220..",
    ".0233333320.",
    "023322223320",
    "023233332320",
    "023322223320",
    ".0233333320.",
    "..02222220..",
    "000000000000",
    "033000000330",
    "030300003030",
    "033000000330",
    "000000000000"]),
  tower: spr([
    "...000000...",
    "..02222220..",
    ".0233333320.",
    "02333333320.",
    "02322222320.",
    "02333333320.",
    "02222222220.",
    ".0022222200.",
    "...0.00.0...",
    "..00.00.00..",
    "..0..00..0..",
    ".00..00..00.",
    ".0...00...0.",
    "000.0000.000"]),
  cart: spr([
    ".....0000000",
    "....03333330",
    "0000333333330",
    "023303333330",
    "023300000000",
    "023300......",
    "000000000000",
    "022222222220",
    "000000000000",
    ".0330...0330",
    "03003...03003",
    ".0330...0330"]),
  weed: spr(["0...0...","01.010.0",".010.010","..0110.."]),
  rock: spr(["...000000...","..02222220..",".0222333220.","022223322220","022222222220","012222222210",".0111111110.","..00000000.."]),
  rockCracked: spr(["...000000...","..02202220..",".0220333220.","022203322220","022220222220","012222022210",".0111111110.","..00000000.."])
};

const COMMON = [
  ["..3..3..","...33...","..3..3.."],
  [".030030.","..0330..","...03...","..0000.."],
  ["..0..0..",".030030.",".033330.","..0330..","..0110.."]
];
const CROPDEF = {
  turnip: { name: 'Turnip', short: 'turnip', days: 3, seed: 4, sell: 12, rep: 0,
    grown: ["..0..0..",".030030.","..0330..","...33...","..0000.."],
    ripe: ["..0..0..",".030030.","..0330..","..0000..",".033330.","03333330",".033330.","...00..."] },
  cabbage: { name: 'Cabbage', short: 'cabbage', days: 4, seed: 10, sell: 28, rep: 0,
    grown: ["..0000..",".033330.","03322330",".033330.","..0110.."],
    ripe: ["..0000..",".033330.","03322330","03233230","03322330",".033330.","..0110.."] },
  corn: { name: 'Corn', short: 'corn', days: 5, seed: 15, sell: 45, rep: 1,
    grown: ["...0....","..030...",".0330...","..030.0.","..03030.","...030..","..0330..","...03...","...03...","..0000.."],
    ripe: ["...00...","..0330..",".030030.",".033330.","00030300","02203030","02203300","00003030","...030..","..0000.."] },
  pumpkin: { name: 'Pumpkin', short: 'pumpkin', days: 6, seed: 20, sell: 70, rep: 0,
    grown: ["...01...",".00100..","0222220.","0222220.",".00000.."],
    ripe: ["....01....","..000100..",".03232330.","0332323330","0332323330",".03232330.","..000000.."] },
  berry: { name: 'Strawberry', short: 'berry', days: 5, seed: 30, sell: 20, rep: 2, regrow: 2,
    grown: ["........","..0..0..",".030030.","03333330",".033330.","..0110.."],
    ripe: ["..0..0..",".030030.","03313130","03111330","03331130",".033330.","..0110.."] }
};
const CROPS = Object.keys(CROPDEF);
const COMMON_S = COMMON.map(r => spr(r));
for (const k of CROPS) { CROPDEF[k].grownS = spr(CROPDEF[k].grown); CROPDEF[k].ripeS = spr(CROPDEF[k].ripe); }
function cropSprite(c) {
  const d = CROPDEF[c.type];
  if (c.stage >= d.days) return d.ripeS;
  if (c.stage >= d.days - 1) return d.grownS;
  return COMMON_S[Math.min(c.stage, 2)];
}

/* ================= font ================= */
const F = {
  A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],
  G:[3,4,5,5,3],H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],
  M:[5,7,7,5,5],N:[6,5,5,5,5],O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],R:[6,5,6,5,5],
  S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],
  Y:[5,5,2,2,2],Z:[7,1,2,4,7],
  '0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[6,1,2,4,7],'3':[6,1,2,1,6],'4':[5,5,7,1,1],
  '5':[7,4,6,1,6],'6':[3,4,6,5,2],'7':[7,1,2,2,2],'8':[2,5,2,5,2],'9':[2,5,3,1,6],
  ' ':[0,0,0,0,0],'!':[2,2,2,0,2],':':[0,2,0,2,0],'-':[0,0,7,0,0],'.':[0,0,0,0,2],
  ',':[0,0,0,2,4],"'":[2,2,0,0,0],'/':[1,1,2,4,4],'?':[6,1,2,0,2],'+':[0,2,7,2,0],'$':[3,6,2,3,6],
  '(':[1,2,2,2,1],')':[4,2,2,2,4]
};
const textW = (s, sc = 1) => String(s).length * 4 * sc - sc;
function txt(s, x, y, col = 3, sc = 1, align = 'l') {
  s = String(s).toUpperCase();
  const w = textW(s, sc);
  x = Math.round(x); y = Math.round(y);
  if (align === 'c') x = Math.round(x - w / 2); else if (align === 'r') x = x - w;
  g.fillStyle = P[col];
  for (const ch of s) {
    const gl = F[ch];
    if (gl) for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++)
      if ((gl[r] >> (2 - c)) & 1) g.fillRect(x + c * sc, y + r * sc, sc, sc);
    x += 4 * sc;
  }
}
function txtO(s, x, y, col = 3, sc = 1, align = 'l', oc = 0) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) txt(s, x + dx, y + dy, oc, sc, align);
  txt(s, x, y, col, sc, align);
}
function box(x, y, w, h, fill = 0) {
  x = Math.round(x); y = Math.round(y);
  g.fillStyle = P[0];
  for (let i = 0; i < w + 5; i++) if (i % 2 === 0) g.fillRect(x - 1 + i, y + h + 3, 1, 1);
  for (let i = 0; i < h + 5; i++) if (i % 2 === 0) g.fillRect(x + w + 3, y - 1 + i, 1, 1);
  g.fillStyle = P[3]; g.fillRect(x - 3, y - 3, w + 6, h + 6);
  g.fillStyle = P[0]; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = P[fill]; g.fillRect(x, y, w, h);
  g.fillStyle = P[1];
  g.fillRect(x - 1, y - 1, w + 2, 1); g.fillRect(x - 1, y + h, w + 2, 1);
  g.fillRect(x - 1, y - 1, 1, h + 2); g.fillRect(x + w, y - 1, 1, h + 2);
  g.fillStyle = P[3];
  for (const [cx, cy] of [[x - 1, y - 1], [x + w - 1, y - 1], [x - 1, y + h - 1], [x + w - 1, y + h - 1]]) g.fillRect(cx, cy, 2, 2);
}
function rule(x, y, w, col = 1) {
  g.fillStyle = P[col]; g.fillRect(x + 2, y, w - 4, 1);
  g.fillRect(x, y, 1, 1); g.fillRect(x + w - 1, y, 1, 1);
}
function wrap(s, max) {
  const words = s.split(' '), out = []; let line = '';
  for (const w of words) { if ((line + ' ' + w).trim().length > max) { if (line) out.push(line); line = w; } else line = (line + ' ' + w).trim(); }
  if (line) out.push(line);
  return out;
}

/* ================= map ================= */
const STATIC = {};
const put = (x0, y0, w, h, type) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) STATIC[x + ',' + y] = type; };
put(2, 1, 3, 2, 'shack');
put(5, 2, 1, 1, 'bin');
put(1, 4, 1, 1, 'crate');
put(3, 5, 1, 1, 'board');
put(6, 4, 1, 1, 'box');
put(1, 14, 3, 3, 'pond');
const TREES = [[1, 19], [4, 19], [2, 22], [5, 23], [1, 26], [4, 27], [2, 30], [5, 31], [1, 33], [6, 33]];
for (const [x, y] of TREES) put(x, y, 1, 1, 'tree');
const isBorder = (x, y) => x <= 0 || y <= 0 || x >= WC - 1 || y >= WR - 1;
const tillable = (x, y) => x >= 9 && x <= WC - 2 && y >= 1 && y <= WR - 2;
const pxTile = (px, py) => [Math.floor(px / TS), Math.floor(py / TS)];

function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const bg = document.createElement('canvas'); bg.width = WW; bg.height = WH;
const POND = { x: TS, y: 14 * TS, w: 48, h: 48 };
(() => {
  const b = bg.getContext('2d'), r = rng(21);
  const R = (c, x, y, w, h) => { b.fillStyle = P[c]; b.fillRect(x, y, w, h); };
  const dot = (c, x, y) => { b.fillStyle = P[c]; b.fillRect(x, y, 1, 1); };
  const free = (x, y) => { const [tx, ty] = pxTile(x, y); return !tillable(tx, ty) && !STATIC[tx + ',' + ty] && !STATIC[tx + ',' + (ty + 1)]; };
  R(3, 0, 0, WW, WH);

  // soft meadow patches
  for (let i = 0; i < 46; i++) {
    const cx = r() * WW, cy = r() * WH, rad = 10 + r() * 16;
    for (let y = -rad; y <= rad; y++) for (let x = -rad; x <= rad; x++) {
      const d = (x * x + y * y) / (rad * rad);
      if (d > 1) continue;
      const px = Math.round(cx + x), py = Math.round(cy + y);
      if (px < 0 || py < 0 || px >= WW || py >= WH) continue;
      const core = px % 2 === 0 && py % 2 === 0;
      if (d < .55 ? core : core && (px + py) % 4 === 0) dot(2, px, py);
    }
  }
  for (let i = 0; i < 1500; i++) dot(2, r() * WW | 0, r() * WH | 0);

  // grass tufts
  for (let i = 0; i < 300; i++) {
    const x = 6 + r() * (WW - 14) | 0, y = 26 + r() * (WH - 48) | 0;
    if (!free(x, y)) continue;
    const c = r() < .72 ? 2 : 1;
    dot(c, x, y); dot(c, x, y + 1);
    dot(c, x + 2, y - 2); dot(c, x + 2, y - 1); dot(c, x + 2, y); dot(c, x + 2, y + 1);
    dot(c, x + 4, y); dot(c, x + 4, y + 1);
  }
  // little flowers
  for (let i = 0; i < 90; i++) {
    const x = 8 + r() * (WW - 18) | 0, y = 28 + r() * (WH - 54) | 0;
    if (!free(x, y)) continue;
    for (const [ox, oy] of [[0, 0], [4, 2], [-3, 3]]) {
      const fx = x + ox, fy = y + oy;
      dot(1, fx, fy - 1); dot(1, fx - 1, fy); dot(1, fx + 1, fy); dot(1, fx, fy + 1); dot(3, fx, fy);
    }
  }

  // dirt path
  const inPath = (x, y) =>
    (x >= 7 * TS + 2 && x < 8 * TS - 2 && y >= 3 * TS + 4 && y < WH - 14) ||
    (y >= 3 * TS + 4 && y < 3 * TS + 13 && x >= 2 * TS + 6 && x < 8 * TS - 2);
  for (let y = 3 * TS; y < WH - 12; y++) for (let x = 2 * TS; x < 8 * TS; x++) {
    if (!inPath(x, y)) continue;
    const edge = !inPath(x - 1, y) || !inPath(x + 1, y) || !inPath(x, y - 1) || !inPath(x, y + 1);
    const edge2 = !inPath(x - 2, y) || !inPath(x + 2, y) || !inPath(x, y - 2) || !inPath(x, y + 2);
    if (edge && (x + y) % 2) continue;
    if (edge2 && (x * 3 + y * 7) % 5 === 0) continue;
    dot(2, x, y);
    if (r() < .07) dot(1, x, y);
  }
  for (let i = 0; i < 36; i++) {
    const x = 7 * TS + 3 + r() * 8 | 0, y = 3 * TS + 20 + r() * (WH - 3 * TS - 44) | 0;
    R(1, x, y, 3, 2); dot(3, x + 1, y);
  }

  // field markers
  b.fillStyle = P[2];
  const fx0 = 9 * TS - 1, fx1 = (WC - 1) * TS, fy0 = TS - 1, fy1 = (WR - 1) * TS;
  for (let x = fx0; x <= fx1; x += 4) { b.fillRect(x, fy0, 2, 1); b.fillRect(x, fy1, 2, 1); }
  for (let y = fy0; y <= fy1; y += 4) { b.fillRect(fx0, y, 1, 2); b.fillRect(fx1, y, 1, 2); }
  for (let y = fy0; y < fy1; y += TS * 4) { R(0, fx0 - 1, y - 4, 2, 9); R(2, fx0 - 1, y - 3, 1, 7); }

  // fence
  const fy = 4;
  R(0, 0, fy + 3, WW, 1); R(3, 0, fy + 4, WW, 1); R(0, 0, fy + 5, WW, 1); R(0, 0, fy + 8, WW, 1); R(3, 0, fy + 9, WW, 1); R(0, 0, fy + 10, WW, 1);
  for (let x = 2; x < WW; x += 12) { R(0, x, fy, 4, 13); R(2, x + 1, fy + 1, 2, 11); R(3, x + 1, fy + 1, 1, 11); }
  const by = WH - 12;
  R(0, 0, by + 2, WW, 1); R(3, 0, by + 3, WW, 1); R(0, 0, by + 4, WW, 1); R(0, 0, by + 7, WW, 1); R(3, 0, by + 8, WW, 1); R(0, 0, by + 9, WW, 1);
  for (let x = 2; x < WW; x += 12) { R(0, x, by - 1, 4, 13); R(2, x + 1, by, 2, 11); R(3, x + 1, by, 1, 11); }
  for (const sx of [4, WW - 10]) {
    R(0, sx + 2, 14, 1, WH - 26); R(0, sx + 4, 14, 1, WH - 26); R(3, sx + 3, 14, 1, WH - 26);
    for (let y = 16; y < WH - 14; y += 12) { R(0, sx, y, 7, 4); R(2, sx + 1, y + 1, 5, 2); }
  }

  // shack
  const hx = 2 * TS, hy = TS;
  b.fillStyle = P[2];
  for (let y = hy + 30; y < hy + 36; y++) for (let x = hx - 2; x < hx + 50; x++) if ((x + y) % 2 === 0) b.fillRect(x, y, 1, 1);
  R(0, hx + 34, hy - 12, 6, 12); R(2, hx + 35, hy - 11, 4, 11); R(3, hx + 35, hy - 11, 1, 11);
  for (let i = 0; i < 18; i++) {
    const w = 10 + i * 2, x0 = hx + 24 - w / 2;
    R(0, x0 - 1, hy - 14 + i, w + 2, 1);
    b.fillStyle = P[(i % 4 === 3) ? 0 : 2];
    for (let xx = x0; xx < x0 + w; xx++) if (i % 4 === 3 || (xx + i) % 3) b.fillRect(xx, hy - 14 + i, 1, 1);
    b.fillStyle = P[3];
    for (let xx = x0; xx < x0 + w; xx++) if (i % 4 === 0 && (xx + i) % 3 === 0) b.fillRect(xx, hy - 14 + i, 1, 1);
  }
  R(0, hx - 1, hy + 4, 50, 1);

  const newly = SHOP.filter(i => i.rep && i.rep > before && i.rep <= rep).map(i => i.name.toLowerCase());
  if (newly.length) say(why + ' New at the crate: ' + newly.join(', '), 4);
  else say(why + (rep > before ? ' Reputation up!' : ''), 3);
}

/* ================= save ================= */
const SAVE_KEY = 'scarecrow-farm-v2';
async function save() {
  try {
    if (!window.storage) return;
    const data = { day, coins, canMax, inv, sel, rainTomorrow, flags, rep, offers, orders, owned,
      farm: farm.map(row => row.map(c => [c.soil ? 1 : 0, c.wet ? 1 : 0, c.obj || 0, c.hp, c.crop ? c.crop.type : 0, c.crop ? c.crop.stage : 0, c.seed || 0])) };
    await window.storage.set(SAVE_KEY, JSON.stringify(data), false);
    hasSave = true;
  } catch (e) {}
}
async function checkSave() {
  try { if (!window.storage) return; const r = await window.storage.get(SAVE_KEY, false); hasSave = !!(r && r.value); } catch (e) { hasSave = false; }
}
async function loadGame() {
  try {
    const r = await window.storage.get(SAVE_KEY, false);
    const d = JSON.parse(r.value);
    blankFarm();
    d.farm.forEach((row, y) => row.forEach((a, x) => {
      const c = farm[y][x]; c.soil = !!a[0]; c.wet = !!a[1]; c.obj = a[2] || null; c.hp = a[3] || 0;
      c.crop = a[4] ? { type: a[4], stage: a[5] } : null; c.seed = a[6] || null;
    }));
    ({ day, coins, canMax, inv, sel, rainTomorrow, rep, offers, orders } = d);
    flags = d.flags || {}; owned = d.owned || {};
    for (const k of ITEMS) if (typeof inv[k] !== 'number') inv[k] = 0;
    startDay(true);
  } catch (e) { newGame(); }
}

/* ================= actions ================= */
const targetTile = () => pxTile(player.x + player.fx * 12, player.y - 5 + player.fy * 12);
function getAction() {
  const [tx, ty] = targetTile();
  if (tx < 0 || ty < 0 || tx >= WC || ty >= WR) return null;
  const st = STATIC[tx + ',' + ty];
  if (st === 'shack') return { label: 'Sleep', fn: trySleep };
  if (st === 'bin') return { label: 'Sell', fn: sell };
  if (st === 'crate') return { label: 'Shop', fn: () => openMenu('shop') };
  if (st === 'board') return { label: 'Orders', fn: () => { openMenu('board'); flags.board = true; } };
  if (st === 'box') return { label: 'Deliver', fn: deliver };
  if (st === 'pond') return { label: 'Refill', fn: refill };
  if (st || isBorder(tx, ty)) return null;
  const c = farm[ty][tx];
  if (c.obj === 'rock') return { label: 'Break', fn: () => {
    c.hp -= owned.hoe ? 2 : 1; sfx.rock(); burst(tx * TS + 8, ty * TS + 10, 6, 2, 50, 70);
    if (c.hp <= 0) { c.obj = null; burst(tx * TS + 8, ty * TS + 10, 10, 1, 70, 80); }
  }};
  if (c.obj === 'weed') return { label: 'Clear', fn: () => {
    c.obj = null; sfx.till(); burst(tx * TS + 8, ty * TS + 10, 6, 1, 40, 60);
    if (Math.random() < .12) {
      const k = Math.random() < .7 ? 'turnip' : 'cabbage', n = k === 'turnip' ? 2 : 1;
      inv[k] += n; texts.push({ s: 'Found ' + n + ' ' + k + ' seeds', x: tx * TS + 8, y: ty * TS - 4, life: 1.4 }); updateItemBtn();
    }
  }};
  if (c.obj === 'drill' && CROPDEF[sel] && inv[sel] > 0 && c.seed !== sel) return { label: 'Load ' + CROPDEF[sel].name.toLowerCase(), fn: () => {
    c.seed = sel; sfx.buy(); texts.push({ s: 'Drill loaded with ' + CROPDEF[sel].name.toLowerCase(), x: tx * TS + 8, y: ty * TS - 6, life: 1.4 });
  }};
  if (MACH[c.obj]) return { label: 'Pick up', fn: () => { inv[c.obj]++; c.obj = null; c.seed = null; sfx.tick(); updateItemBtn(); } };
  if (c.crop) {
    if (c.crop.stage >= CROPDEF[c.crop.type].days) return { label: 'Harvest', fn: () => harvest(c, tx, ty) };
    if (!c.wet) return { label: 'Water', fn: () => water(c, tx, ty) };
    return null;
  }
  const placeable = !!MACH[sel];
  if (c.soil) {
    if (placeable && inv[sel] > 0 && sel !== 'drill') return { label: 'Place', fn: () => {
      c.obj = sel; c.seed = null; inv[sel]--; sfx.plant(); if (!inv[sel]) cycleItem(); updateItemBtn();
    }};
    if (!placeable && inv[sel] > 0) return { label: 'Plant', fn: () => plant(c) };
    if (!c.wet) return { label: 'Water', fn: () => water(c, tx, ty) };
    return null;
  }
  if (placeable && inv[sel] > 0) return { label: 'Place', fn: () => {
    c.obj = sel; c.seed = null; inv[sel]--; sfx.plant();
    if (sel === 'drill') say('Face the drill holding seeds to load it', 3);
    if (!inv[sel]) cycleItem();
    updateItemBtn();
  }};
  if (tillable(tx, ty)) return { label: 'Till', fn: () => { c.soil = true; c.wet = rain; flags.tilled = true; sfx.till(); burst(tx * TS + 8, ty * TS + 10, 6, 1, 40, 60); } };
  return null;
}
function plant(c) {
  c.crop = { type: sel, stage: 0 }; inv[sel]--; flags.planted = true;
  sfx.plant();
  if (!inv[sel]) { const n = CROPS.find(k => inv[k] > 0); if (n) sel = n; }
  updateItemBtn();
}
function water(c, tx, ty) {
  if (can <= 0) { say('Your can is empty. Refill at the pond'); sfx.nope(); return; }
  can--; c.wet = true; flags.watered = true; sfx.water();
  for (let i = 0; i < 7; i++) parts.push({ x: tx * TS + 3 + Math.random() * 10, y: ty * TS - 2, vx: 0, vy: 30 + Math.random() * 30, life: .35, col: 1, grav: 80 });
}
function harvest(c, tx, ty) {
  const d = CROPDEF[c.crop.type];
  inv.basket[c.crop.type]++; flags.harvested = true;
  texts.push({ s: '+1 ' + d.name, x: tx * TS + 8, y: ty * TS - 6, life: 1 });
  if (d.regrow) c.crop.stage = d.days - d.regrow; else c.crop = null;
  sfx.harvest();
}
function refill() {
  if (can >= canMax) { say('Your can is already full'); return; }
  can = canMax; sfx.refill(); say('Can refilled');
}
function sell() {
  let n = 0, total = 0, kept = 0;
  for (const k of CROPS) {
    const keep = Math.min(inv.basket[k], reserved(k)), s = inv.basket[k] - keep;
    kept += keep; n += s; total += s * CROPDEF[k].sell; inv.basket[k] = keep;
  }
  if (!n) { say(kept ? 'Your basket is saved for orders' : 'Harvest crops first, then sell here'); sfx.nope(); return; }
  coins += total; dayStats.earned += total; flags.sold = true;
  texts.push({ s: '+$' + total, x: 5 * TS + 8, y: 2 * TS - 4, life: 1.3 });
  if (kept) say('Kept ' + kept + ' for your orders');
  sfx.sell();
}
function trySleep() {
  if (sleepArm > 0) { endDay(false); return; }
  sleepArm = 2.5; say('Tap Sleep again to end the day', 2.5);
}
function openMenu(kind) { state = kind; menuIdx = 0; menuMsg = null; shopTop = 0; sfx.tick(); }
function buy() {
  const it = SHOP[menuIdx];
  if (it.rep && rep < it.rep) { menuMsg = 'Needs ' + it.rep + (it.rep === 1 ? ' reputation star' : ' reputation stars'); sfx.nope(); return; }
  if (it.upg && owned[it.k]) { menuMsg = 'You already own it'; sfx.nope(); return; }
  if (coins < it.price) { menuMsg = 'Not enough coins'; sfx.nope(); return; }
  coins -= it.price;
  if (it.mach) flags.mach = true;
  if (it.upg) {
    owned[it.k] = true;
    if (it.k === 'can') { canMax = 20; can = 20; }
  } else inv[it.k]++;
  menuMsg = 'Bought ' + it.name.toLowerCase(); sfx.buy();
  if (ITEMS.includes(it.k) && !inv[sel]) sel = it.k;
  updateItemBtn();
}
function takeOrder() {
  const o = offers[menuIdx];
  if (!o) return;
  if (orders.length >= maxOrders()) { menuMsg = 'You can hold ' + maxOrders() + ' orders at a time'; sfx.nope(); return; }
  orders.push(o); offers.splice(menuIdx, 1);
  menuIdx = Math.max(0, Math.min(menuIdx, offers.length - 1));
  menuMsg = 'Order taken! Deliver at the box'; sfx.buy();
}
function cycleItem() {
  const have = ITEMS.filter(k => inv[k] > 0);
  if (!have.length) { updateItemBtn(); return; }
  const i = have.indexOf(sel);
  sel = have[(i + 1) % have.length];
  sfx.tick(); updateItemBtn();
}
function shoo() {
  if (player.cd > 0) return;
  player.cd = .45; player.flail = .35;
  const ox = player.x, oy = player.y - 4, R = 64;
  rings.push({ x: ox, y: oy, r: 2, life: R / 200 + .08 });
  burst(ox, player.y - 12, 6, 2, 50, 40);
  sfx.shoo();
  let n = 0;
  for (const cr of crows) {
    if (cr.st === 'flee') continue;
    const dx = cr.x - ox, dy = (cr.y - oy) / .75;
    if (dx * dx + dy * dy > R * R) continue;
    burst(cr.x, cr.y - cr.alt - 3, 5, 0, 50, 15);
    flee(cr, ox, oy); n++;
  }
  if (n) { sfx.flee(); flags.shooed = true; }
}

/* ================= day end ================= */
function endDay(fell) {
  state = 'night'; cardT = 0;
  for (const cr of crows) if (cr.st !== 'flee') flee(cr, player.x, player.y);
  let grown = 0, dry = 0;
  for (const row of farm) for (const c of row) if (c.crop) { if (c.wet) grown++; else dry++; }
  const L = [];
  if (fell) L.push('You nodded off in the field.');
  L.push(dayStats.earned ? 'Earned $' + dayStats.earned + ' today' : 'No coins earned today');
  if (grown) L.push(grown + (grown === 1 ? ' watered crop will grow' : ' watered crops will grow'));
  if (dry) L.push(dry + (dry === 1 ? ' dry crop will wait' : ' dry crops will wait'));
  const missed = orders.filter(o => o.due <= day);
  for (const o of missed) L.push('Missed the ' + o.client + ' order');
  if (missed.length) { orders = orders.filter(o => o.due > day); rep = Math.max(0, rep - missed.length); L.push(missed.length > 1 ? 'You lost reputation stars' : 'You lost a reputation star'); }
  for (const o of orders) if (o.due === day + 1) L.push(o.client + ' order is due tomorrow');
  let mach = 0, idle = 0;
  for (const row of farm) for (const c of row) if (MACH[c.obj] && c.obj !== 'chime') { mach++; if (c.obj === 'drill' && (!c.seed || !inv[c.seed])) idle++; }
  if (mach) L.push(mach + (mach === 1 ? ' machine will run at dawn' : ' machines will run at dawn'));
  if (idle) L.push(idle + (idle === 1 ? ' drill has no seed' : ' drills have no seed'));
  L.push(rainTomorrow ? 'Tomorrow looks rainy' : 'Tomorrow looks sunny');
  cardTitle = 'End of day ' + day;
  cardLines = L;
  sfx.night();
}
function overnight() {
  for (const row of farm) for (const c of row) {
    if (c.crop && c.wet) c.crop.stage = Math.min(CROPDEF[c.crop.type].days, c.crop.stage + 1);
    c.wet = false;
  }
}
function continueCard() {
  if (cardT < .7) return;
  overnight(); day++; startDay(false);
}

/* ================= crows ================= */
function guards() {
  const a = [];
  for (let y = 0; y < WR; y++) for (let x = 0; x < WC; x++) if (farm[y][x].obj === 'chime') a.push([x * TS + 8, y * TS + 12]);
  return a;
}
function protectedAt(x, y, ch) {
  if (Math.hypot(x - player.x, y - player.y) < 56) return true;
  for (const [cx, cy] of ch) if (Math.hypot(x - cx, y - cy) < 48) return true;
  return false;
}
function pickTarget() {
  const ch = guards(), opts = [];
  for (let y = 0; y < WR; y++) for (let x = 0; x < WC; x++) {
    if (!farm[y][x].crop) continue;
    const px = x * TS + 8, py = y * TS + 13;
    if (!protectedAt(px, py, ch)) opts.push({ x, y, px, py });
  }
  return opts.length ? pickR(opts) : null;
}
function spawnCrow() {
  const tg = pickTarget(); if (!tg) return;
  const side = Math.random() * 3 | 0; let x, y;
  if (side === 0) { x = tg.px + (Math.random() - .5) * 200; y = tg.py - 160; }
  else if (side === 1) { x = tg.px + 180; y = tg.py + (Math.random() - .5) * 200; }
  else { x = tg.px + (Math.random() - .5) * 200; y = tg.py + 180; }
  crows.push({ x, y, st: 'in', tg, alt: 20, vx: 0, vy: 0, face: 1, bite: 0, anim: Math.random() * 9, check: 0, life: 3 });
  flags.crowSeen = true;
}
function flee(cr, fx, fy) {
  let dx = cr.x - fx, dy = cr.y - fy, d = Math.hypot(dx, dy);
  if (d < 2) { dx = Math.random() - .5; dy = -1; d = Math.hypot(dx, dy); }
  cr.st = 'flee'; cr.life = 3; cr.vx = dx / d * 110; cr.vy = dy / d * 110 - 25; cr.face = cr.vx > 0 ? 1 : 0;
}
function updateCrows(dt) {
  const ch = guards();
  for (const cr of crows) {
    cr.anim += dt;
    if (cr.st === 'in') {
      const c = farm[cr.tg.y][cr.tg.x];
      cr.check -= dt;
      if (!c.crop) { flee(cr, cr.x, cr.y + 20); continue; }
      if (cr.check <= 0) { cr.check = .3; if (protectedAt(cr.tg.px, cr.tg.py, ch)) { flee(cr, player.x, player.y); continue; } }
      const dx = cr.tg.px - cr.x, dy = cr.tg.py - cr.y, d = Math.hypot(dx, dy), sp = 36;
      if (d <= sp * dt + .5) { cr.x = cr.tg.px; cr.y = cr.tg.py; cr.st = 'eat'; cr.bite = 2.6; cr.alt = 0; if (onScreen(cr.x, cr.y)) sfx.caw(); }
      else { cr.x += dx / d * sp * dt; cr.y += dy / d * sp * dt; if (Math.abs(dx) > .5) cr.face = dx > 0 ? 1 : 0; cr.alt = Math.min(20, d * .35); }
    } else if (cr.st === 'eat') {
      const c = farm[cr.tg.y][cr.tg.x];
      if (!c.crop) { flee(cr, cr.x, cr.y + 20); continue; }
      if (protectedAt(cr.x, cr.y, ch)) { flee(cr, player.x, player.y); continue; }
      cr.bite -= dt;
      if (cr.bite <= 0) {
        if (onScreen(cr.x, cr.y)) sfx.peck();
        burst(cr.x, cr.y - 4, 5, 3, 30, 40);
        if (c.crop.stage <= 0) { c.crop = null; texts.push({ s: 'Seed eaten!', x: cr.x, y: cr.y - 16, life: 1.1 }); }
        else { c.crop.stage--; texts.push({ s: 'Pecked!', x: cr.x, y: cr.y - 16, life: 1.1 }); }
        flee(cr, cr.x, cr.y + 20);
      }
    } else {
      cr.x += cr.vx * dt; cr.y += cr.vy * dt; cr.alt = Math.min(40, cr.alt + dt * 40); cr.life -= dt;
    }
  }
  crows = crows.filter(c => !(c.st === 'flee' && c.life <= 0));
}
function burst(x, y, n, col, spread = 40, grav = 20) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * spread, vy: (Math.random() - .8) * spread, life: .45 + Math.random() * .45, col, grav });
}

/* ================= layout / camera ================= */
const HUD_H = 12;
const hudTop = () => satTop;
const trackerH = () => orders.length && state !== 'title' ? orders.length * 8 + 3 : 0;
const playTop = () => hudTop() + HUD_H + trackerH();
const playBot = () => VH - ctrlH;
function camTarget() {
  const pt = playTop(), pb = playBot();
  let tx = player.x - VW / 2, ty = player.y - 8 - (pt + pb) / 2;
  tx = WW <= VW ? (WW - VW) / 2 : Math.max(0, Math.min(WW - VW, tx));
  const minY = -pt + 2, maxY = WH - pb;
  ty = maxY < minY ? (minY + maxY) / 2 : Math.max(minY, Math.min(maxY, ty));
  return [tx, ty];
}
function snapCam() { const [x, y] = camTarget(); cam.x = x; cam.y = y; }
const onScreen = (x, y) => x > cam.x - 10 && x < cam.x + VW + 10 && y > cam.y - 20 && y < cam.y + VH + 10;

/* ================= update ================= */
const keys = {};
let jx = 0, jy = 0;
function solidTile(x, y) {
  if (x < 0 || y < 0 || x >= WC || y >= WR) return true;
  if (isBorder(x, y) || STATIC[x + ',' + y]) return true;
  const o = farm[y][x].obj;
  return o === 'rock' || !!MACH[o];
}
function blocked(px, py) {
  for (const [ox, oy] of [[-4, -4], [4, -4], [-4, 0], [4, 0]]) {
    const [tx, ty] = pxTile(px + ox, py + oy);
    if (solidTile(tx, ty)) return true;
  }
  return false;
}
function menuNav(dt, count) {
  navT -= dt;
  let ny = jy; if (keys.arrowup || keys.w) ny = -1; if (keys.arrowdown || keys.s) ny = 1;
  if (Math.abs(ny) > .6 && navT <= 0 && count > 0) { menuIdx = (menuIdx + (ny > 0 ? 1 : -1) + count) % count; navT = .22; menuMsg = null; sfx.tick(); }
  if (Math.abs(ny) <= .6) navT = 0;
}
function update(dt) {
  clock += dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt; p.vx *= .96; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const x of texts) { x.y -= 14 * dt; x.life -= dt; }
  texts = texts.filter(x => x.life > 0);
  for (const r of rings) { r.r += 200 * dt; r.life -= dt; }
  rings = rings.filter(r => r.life > 0);
  if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }

  if (state === 'title') {
    cam.x = Math.max(0, Math.min(WW - VW, 200 - VW / 2 + Math.sin(clock * .2) * 60));
    cam.y = Math.max(-30, Math.min(WH - VH, 60 + Math.sin(clock * .13) * 40));
    return;
  }
  if (state === 'night') { cardT += dt; updateCrows(dt); return; }
  if (state === 'shop') { menuNav(dt, SHOP.length); return; }
  if (state === 'board') { menuNav(dt, offers.length); return; }
  if (state !== 'day') return;

  let mx = jx, my = jy;
  if (keys.arrowleft || keys.a) mx -= 1;
  if (keys.arrowright || keys.d) mx += 1;
  if (keys.arrowup || keys.w) my -= 1;
  if (keys.arrowdown || keys.s) my += 1;
  const m = Math.hypot(mx, my);
  if (m > 1) { mx /= m; my /= m; }
  player.moving = m > .1;
  if (player.moving) {
    if (Math.abs(mx) > Math.abs(my)) { player.fx = mx > 0 ? 1 : -1; player.fy = 0; }
    else { player.fx = 0; player.fy = my > 0 ? 1 : -1; }
    const sp = (owned.boots ? 94 : 72) * dt;
    const nx = player.x + mx * sp; if (!blocked(nx, player.y)) player.x = nx;
    const ny = player.y + my * sp; if (!blocked(player.x, ny)) player.y = ny;
    player.step += dt;
    if (Math.random() < dt * 5) parts.push({ x: player.x + (Math.random() * 6 - 3), y: player.y, vx: 0, vy: -4, life: .3, col: 2, grav: 0 });
  }
  player.bob = player.moving ? -Math.round(Math.abs(Math.sin(player.step * 11)) * 3) : 0;
  player.cd = Math.max(0, player.cd - dt);
  player.flail = Math.max(0, player.flail - dt);
  player.act = Math.max(0, player.act - dt);
  sleepArm = Math.max(0, sleepArm - dt);

  const [ctx, cty] = camTarget(), k = Math.min(1, dt * 8);
  cam.x += (ctx - cam.x) * k; cam.y += (cty - cam.y) * k;

  t += dt;
  updateCrows(dt);

  const cm = clockMin();
  if (!rain && cm > 480 && cm < endMin() - 90) {
    spawnT -= dt;
    let planted = 0; for (const row of farm) for (const c of row) if (c.crop) planted++;
    const cap = Math.min(7, 1 + Math.floor(planted / 6));
    if (spawnT <= 0) {
      if (planted && crows.filter(c => c.st !== 'flee').length < cap) spawnCrow();
      spawnT = Math.max(2.5, 9 - planted * .1) * (.6 + Math.random() * .8);
    }
  }
  if (rain) for (let i = 0; i < 2; i++) if (Math.random() < dt * 40) parts.push({ x: cam.x + Math.random() * (VW + 60), y: cam.y - 4, vx: -30, vy: 240, life: 2, col: 2, grav: 0, rain: true });
  if (t >= dayLen()) endDay(true);
}

/* ================= draw ================= */
function shadow(x, y, w) {
  const [tx, ty] = pxTile(x, y);
  const row = farm[ty], onSoil = !!(row && row[tx] && row[tx].soil);
  g.fillStyle = P[onSoil ? 0 : 2];
  g.fillRect(Math.round(x - w / 2), Math.round(y), w, 1);
  g.fillRect(Math.round(x - w / 2) + 1, Math.round(y) + 1, w - 2, 1);
}
function drawPlayer() {
  const jit = player.flail > 0 ? (Math.round(clock * 40) % 2 ? 1 : -1) : 0;
  shadow(player.x, player.y - 1, player.bob < -1 ? 5 : 7);
  const s = player.flail > 0 ? SC_F : player.fy < 0 ? SC_BACK : SC;
  g.drawImage(s, Math.round(player.x - 6 + jit), Math.round(player.y - 17 + player.bob));
}
function drawCursor() {
  const [tx, ty] = targetTile();
  if (tx < 0 || ty < 0 || tx >= WC || ty >= WR) return;
  const a = getAction(), x = tx * TS, y = ty * TS, L = 4;
  g.fillStyle = P[a ? 0 : 2];
  const pulse = Math.floor(clock * 3) % 2 ? 0 : 1;
  const x0 = x - pulse, y0 = y - pulse, x1 = x + TS - 1 + pulse, y1 = y + TS - 1 + pulse;
  g.fillRect(x0, y0, L, 1); g.fillRect(x0, y0, 1, L);
  g.fillRect(x1 - L + 1, y0, L, 1); g.fillRect(x1, y0, 1, L);
  g.fillRect(x0, y1, L, 1); g.fillRect(x0, y1 - L + 1, 1, L);
  g.fillRect(x1 - L + 1, y1, L, 1); g.fillRect(x1, y1 - L + 1, 1, L);
}
function pixelRing(x, y, r, col) {
  g.fillStyle = P[col];

const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let sid = null;
function mv(e) {
  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = r.width / 2 * .55, d = Math.hypot(dx, dy);
  if (d > m) { dx *= m / d; dy *= m / d; }
  jx = dx / m; jy = dy / m;
  if (Math.hypot(jx, jy) < .18) { jx = 0; jy = 0; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
stick.addEventListener('pointerdown', e => { sid = e.pointerId; stick.setPointerCapture(sid); au(); mv(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === sid) mv(e); });
const release = e => { if (e.pointerId === sid) { sid = null; jx = jy = 0; knob.style.transform = 'translate(-50%,-50%)'; } };
stick.addEventListener('pointerup', release);

  D50 = makeDither(3); D25 = makeDither(2); D12 = makeDither(1);
  const pr = pad.getBoundingClientRect();
  ctrlH = Math.max(0, Math.ceil((h - pr.top) / scale) - 8);
  satTop = Math.ceil(sat.getBoundingClientRect().height / scale);
  if (state === 'day') snapCam();
}
addEventListener('resize', resize);
resize();
blankFarm();
checkSave();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(); updateUseBtn();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
